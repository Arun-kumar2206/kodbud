<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="topbar-left">
          <a href="#">About</a>
          <a href="#">Store</a>
        </div>
        <div class="topbar-right">
          <a href="#">Gmail</a>
          <a href="#">Images</a>
          <button class="apps" aria-label="Google apps" type="button">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <button class="signin" type="button">Sign in</button>
        </div>
      </header>

      <main class="main">
        <div class="logo" aria-label="Google logo">
          <span class="g">G</span><span class="o1">o</span
          ><span class="o2">o</span><span class="g2">g</span
          ><span class="l">l</span><span class="e">e</span>
        </div>

        <form class="search" role="search" aria-label="Google search">
          <span class="icon" aria-hidden="true">&#128269;</span>
          <input
            type="text"
            aria-label="Search"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="mic" aria-hidden="true">&#127908;</span>
          <span class="cam" aria-hidden="true">&#128247;</span>
        </form>

        <div class="actions">
          <button type="button">Google Search</button>
          <button type="button">I am Feeling Lucky</button>
        </div>

        <p class="language">
          Google offered in: <a href="#">Hindi</a> <a href="#">Tamil</a>
          <a href="#">Telugu</a> <a href="#">Marathi</a>
        </p>
      </main>

      <footer class="footer">
        <div class="footer-region">India</div>
        <div class="footer-links">
          <div>
            <a href="#">Advertising</a>
            <a href="#">Business</a>
            <a href="#">How Search works</a>
          </div>
          <div>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Settings</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
