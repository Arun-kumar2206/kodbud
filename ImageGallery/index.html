<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solstice Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <span class="pill">Image Gallery</span>
        <h1>Solstice Gallery</h1>
        <p>Calm landscapes, tactile textures, and soft light studies.</p>
      </header>

      <section class="gallery">
        <figure>
          <img
            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
            alt="Mountain range under golden light"
          />
          <figcaption>Golden ridge</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80"
            alt="Forest path with sun rays"
          />
          <figcaption>Forest hush</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
            alt="Foggy lake at sunrise"
          />
          <figcaption>Mist drift</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c?auto=format&fit=crop&w=1200&q=80"
            alt="Calm lake with reflected mountains"
          />
          <figcaption>Mirror calm</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=80"
            alt="Waves meeting rocky shore"
          />
          <figcaption>Salt line</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1443890923422-7819ed4101c0?auto=format&fit=crop&w=1200&q=80"
            alt="Sand dunes under soft sky"
          />
          <figcaption>Quiet dunes</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
            alt="Ocean at sunset"
          />
          <figcaption>Sunset tide</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80"
            alt="Snowy mountain peak"
          />
          <figcaption>Cold ascent</figcaption>
        </figure>
        <figure>
          <img
            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80"
            alt="Valley with river"
          />
          <figcaption>Valley bend</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
